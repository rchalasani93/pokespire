name = "pokespire"
main = "src/worker.js"
compatibility_date = "2026-05-15"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "pokespire"
# Replace with the id printed by `npx wrangler d1 create pokespire` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
